{id:'fixit',emoji:'🎬',name:'Film Room: Fix the Play',desc:'Break down variables-on-both-sides equations one move at a time, plus the x = 0 trap.',doneMsg:'Plays fixed. The team is locked in!',
strategy:`<p><b>Film Room Playbook: The Balance Rule ⚖️</b></p><ol><li><b>Gather the variables.</b> Do the OPPOSITE of the smaller variable term to BOTH sides. If you see −2r, <b>add 2r</b>; if you see +3x, <b>subtract 3x</b>.</li>
<li><b>Gather the numbers.</b> Do the opposite of the number next to the variable term, to both sides.</li><li><b>Divide</b> by the number in front of the variable.</li><li><b>Check</b> by plugging in. Both sides must match.</li></ol>
<p>🚫 Never “move” a term without changing it: what you do to one side, you do to the other.</p>
<p><b>Outcome decoder:</b> after gathering the variables…<br>• a variable is left (4x = 0) → <b>one solution</b>, even if it's <b>x = 0</b>!<br>• variables vanish, false (−3 = 1) → <b>no solution</b><br>• variables vanish, true (−4 = −4) → <b>infinitely many</b></p>`,

MOVE('20 + 7r = 62',['Add 20 to both sides','Subtract 20 from both sides','Divide both sides by 20','Subtract 7 from both sides'],1,'7r = 42','The 20 is being ADDED to 7r, so subtract 20 from both sides: 62 − 20 = 42.'),
MOVE('7r = 42',['Subtract 7 from both sides','Multiply both sides by 7','Divide both sides by 7','Divide both sides by 42'],2,'r = 6','7r means 7 × r, so divide both sides by 7: 42 ÷ 7 = 6.'),
MOVE('r = 6',['20 + 5(6) = 50 and 62 − 2(6) = 50 ✓','20 + 5 + 6 = 31 and 62 − 2 − 6 = 54','5(6) = 30 and 2(6) = 12','No check needed'],0,'',"Check by plugging 6 into BOTH original sides: 20 + 30 = 50 and 62 − 12 = 50.",'Which check proves r = 6 is right?')]}),
STEPS({id:'f2',skill:'vars-both-sides-moves',label:'Play 2',q:'Solve 3x + 14 = 7x − 2 one move at a time.',h:'Subtract the SMALLER x-term (3x) so x stays positive.',s:'3x + 14 = 7x − 2\n14 = 4x − 2 (subtract 3x)\n16 = 4x (add 2)\nx = 4 (divide by 4)\nCheck: 12 + 14 = 26 and 28 − 2 = 26 ✓',steps:[
MOVE('3x + 14 = 7x − 2',['Add 3x to both sides','Subtract 3x from both sides','Subtract 14 from the right side only','Divide both sides by 3'],1,'14 = 4x − 2','Subtracting 3x removes it from the left and leaves 7x − 3x = 4x on the right.'),
MOVE('14 = 4x − 2',['Add 2 to both sides','Subtract 2 from both sides','Add 14 to both sides','Divide both sides by 2'],0,'16 = 4x','The 2 is SUBTRACTED, so add 2 to both sides: 14 + 2 = 16.'),
MOVE('16 = 4x',['Subtract 4 from both sides','Divide both sides by 4','Multiply both sides by 4','Divide both sides by 16'],1,'x = 4','4x means 4 × x, so divide by 4: 16 ÷ 4 = 4.')]}),
STEPS({id:'f3',skill:'vars-both-sides-negative',label:'Play 3',q:'Solve 9 − 4n = 2n − 15 one move at a time.',h:'The −4n is on the left. Add 4n to both sides.',s:'9 − 4n = 2n − 15\n9 = 6n − 15 (add 4n)\n24 = 6n (add 15)\nn = 4 (divide by 6)\nCheck: 9 − 16 = −7 and 8 − 15 = −7 ✓',steps:[
MOVE('9 − 4n = 2n − 15',['Subtract 4n from both sides','Add 4n to both sides','Add 2n to both sides','Subtract 9 from the left side only'],1,'9 = 6n − 15','Adding 4n cancels −4n on the left and gives 2n + 4n = 6n on the right. (Subtracting 4n would make it −8n.)'),
MOVE('9 = 6n − 15',['Subtract 15 from both sides','Add 15 to both sides','Add 9 to both sides','Divide both sides by 15'],1,'24 = 6n','The 15 is SUBTRACTED, so add 15 to both sides: 9 + 15 = 24.'),

NUM({id:'f4',skill:'vars-both-sides',label:'Play 4 · Solo',q:'Your fan section has 6 fans and grows by 3 fans per minute. The visitors\' section has 30 fans and shrinks by 5 per minute as they head home. Solve 6 + 3k = 30 − 5k to find when the sections are equal (k minutes).',a:'3',h:'Use the Balance Rule: add 5k to both sides first.',s:'6 + 8k = 30 (add 5k)\n8k = 24 (subtract 6)\nk = 3 minutes\nCheck: 6 + 9 = 15 and 30 − 15 = 15 ✓'}),

strategy:`<p><b>Court Design Playbook: The Angle Toolkit 📐</b> Name the relationship FIRST, then write the equation.</p><ul>
<li><b>Straight line / supplementary:</b> add to 180°</li><li><b>Vertical angles</b> (across an X): equal</li><li><b>Triangle:</b> three angles add to 180°</li>
<li><b>Parallel lines + transversal:</b> corresponding and alternate interior angles are <b>equal</b>; same-side interior angles add to <b>180°</b></li></ul>
<p><b>Composite figures 🧩</b> Split it or subtract it: area = big rectangle − missing piece (or add the pieces). Perimeter = walk the whole outside edge and add every side.</p>`,
